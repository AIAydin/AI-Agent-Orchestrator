name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/verify-metadata.mjs
      - run: >-
          node --test
          scripts/release/artifacts.test.mjs
          scripts/release/checksums.test.mjs
          scripts/release/metadata.test.mjs
          scripts/release/signing.test.mjs
          scripts/startup/start-from-source.test.mjs
      - run: pnpm check:structure
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build

  electron-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: pnpm --filter @forgeboard/windows-durable-fs test:native
      - if: runner.os == 'Windows'
        run: pnpm --filter @forgeboard/windows-durable-fs test:electron
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - if: runner.os != 'Linux'
        run: pnpm test:e2e

  collab-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker build -f apps/collab-server/Dockerfile -t forgeboard-collab:ci .

  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgeboard/test-agent build
      - run: pnpm --filter @forgeboard/desktop package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @forgeboard/desktop smoke:packaged
      - if: runner.os != 'Linux'
        run: pnpm --filter @forgeboard/desktop smoke:packaged
