name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/verify-metadata.mjs
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/verify-metadata.mjs --verify-tag
      - run: >-
          node --test
          scripts/release/artifacts.test.mjs
          scripts/release/checksums.test.mjs
          scripts/release/metadata.test.mjs
          scripts/release/signing.test.mjs
          scripts/startup/start-from-source.test.mjs
      - run: pnpm verify
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - if: runner.os != 'Linux'
        run: pnpm test:e2e
      - run: pnpm --filter @forgeboard/test-agent build
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK//[[:space:]]/}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            if [[ -z "${CSC_KEY_PASSWORD//[[:space:]]/}" ]]; then
              unset CSC_KEY_PASSWORD
            fi
            if [[ -z "${APPLE_ID//[[:space:]]/}" || \
                  -z "${APPLE_APP_SPECIFIC_PASSWORD//[[:space:]]/}" || \
                  -z "${APPLE_TEAM_ID//[[:space:]]/}" ]]; then
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            fi
          fi
          pnpm package
          node scripts/release/artifacts.mjs apps/desktop/release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          } elseif ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          pnpm package
          node scripts/release/artifacts.mjs apps/desktop/release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          pnpm package
          node scripts/release/artifacts.mjs apps/desktop/release
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @forgeboard/desktop smoke:packaged
      - if: runner.os != 'Linux'
        run: pnpm --filter @forgeboard/desktop smoke:packaged
      - name: Install and smoke native artifacts
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @forgeboard/desktop smoke:installer
      - name: Install and smoke native artifacts
        if: runner.os != 'Linux'
        run: pnpm --filter @forgeboard/desktop smoke:installer
      - run: node scripts/release/checksums.mjs apps/desktop/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forgeboard-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/RELEASE-INFO-*.json
            apps/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach bundled Git corresponding source
        run: |
          node scripts/release/verify-metadata.mjs --verify-tag
          node scripts/release/artifacts.mjs artifacts --all
          node scripts/release/download-sources.mjs artifacts
          node scripts/release/checksums.mjs artifacts SHA256SUMS-source-and-installers.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--verify-tag --title "Forgeboard ${GITHUB_REF_NAME}")
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* "${release_args[@]}"
